server:
  port: 8085

spring:
  application:
    name: budget-service
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/budget_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/tunisia-tourism}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:9090/realms/tunisia-tourism/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  exchange-rate-api: https://open.er-api.com/v6/latest/TND

springdoc:
  api-docs:
    path: /api/budget/v3/api-docs
  swagger-ui:
    path: /api/budget/swagger-ui.html
